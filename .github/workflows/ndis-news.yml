name: Refresh NDIS news

on:
  schedule:
    - cron: "20 7,13,19,23 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest headlines into Plan Decoder
        env:
          SECRET: ${{ secrets.PD_CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "Add GitHub secret PD_CRON_SECRET (same value as Worker BETTER_AUTH_SECRET)."
            exit 1
          fi
          curl -fsS -X POST "https://www.plandecoder.com/api/news" \
            -H "x-pd-cron: $SECRET" \
            -H "content-type: application/json"
